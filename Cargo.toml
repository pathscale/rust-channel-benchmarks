[package]
name = "benchmarks"
version = "0.1.0"
edition = "2018"

[lib]
path = "lib.rs"

[dependencies]
async-channel = "1.7"
bounded-spsc-queue = "0.4"
crossbeam = "0.8"
crossbeam-channel = "0.5"
flume = "0.10"
futures = { version = "0.3", features = ["thread-pool"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
kanal = "0.1.1"
crossfire = "3.1.7"
futures-intrusive = { version = "0.5.0", features = ["parking_lot"] }
parking_lot = "0.12"
eyre = "0.6"
multiqueue2 = { git = "https://github.com/abbychau/multiqueue2" }

[profile.release]
opt-level = 3
debug = false
overflow-checks = false
lto = 'thin'
panic = 'abort'
codegen-units = 1
rpath = false


[[bin]]
name = "crossbeam-channel"
path = "crossbeam-channel.rs"
doc = false

[[bin]]
name = "kanal"
path = "kanal.rs"
doc = false

[[bin]]
name = "kanal-async"
path = "kanal-async.rs"
doc = false

[[bin]]
name = "flume"
path = "flume.rs"
doc = false

[[bin]]
name = "flume-async"
path = "flume-async.rs"
doc = false

[[bin]]
name = "futures-channel"
path = "futures-channel.rs"
doc = false

[[bin]]
name = "mpsc"
path = "mpsc.rs"
doc = false

[[bin]]
name = "async-channel"
path = "async-channel.rs"
doc = false

[[bin]]
name = "crossfire"
path = "crossfire.rs"
doc = false

[[bin]]
name = "crossfire-async"
path = "crossfire-async.rs"
doc = false

[[bin]]
name = "futures-intrusive"
path = "futures-intrusive.rs"
doc = false

[[bin]]
name = "tokio-mpsc"
path = "tokio-mpsc.rs"
doc = false

[[bin]]
name = "pipe-connector"
path = "pipe-connector-bench.rs"
doc = false

[[bin]]
name = "tokio-oneshot"
path = "tokio-oneshot.rs"
doc = false

[[bin]]
name = "bounded-spsc-queue"
path = "bounded-spsc-queue.rs"
doc = false

[[bin]]
name = "multiqueue2"
path = "multiqueue2.rs"
doc = false
